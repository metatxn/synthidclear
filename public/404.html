<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<meta name="robots" content="noindex" />
	<title>Page Not Found | SynthIDClear</title>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="icon" href="/favicon.ico" sizes="32x32" />
	<style>
		:root {
			--bg-canvas: #f6f5f1;
			--bg-card: #faf9f6;
			--text-primary: #111110;
			--text-secondary: #4a4843;
			--border-color: #dfdcd3;
			--brand-color: #e03e1a;
			--brand-hover: #c43212;
			--brand-text: #ffffff;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg-canvas: #111110;
				--bg-card: #151513;
				--text-primary: #f3f1ea;
				--text-secondary: #b3afa5;
				--border-color: #2a2925;
				--brand-color: #f0522e;
				--brand-hover: #ff6745;
				--brand-text: #111110;
			}
		}
		:root[data-theme="dark"] {
			color-scheme: dark;
			--bg-canvas: #111110;
			--bg-card: #151513;
			--text-primary: #f3f1ea;
			--text-secondary: #b3afa5;
			--border-color: #2a2925;
			--brand-color: #f0522e;
			--brand-hover: #ff6745;
			--brand-text: #111110;
		}
		:root[data-theme="light"] {
			color-scheme: light;
			--bg-canvas: #f6f5f1;
			--bg-card: #faf9f6;
			--text-primary: #111110;
			--text-secondary: #4a4843;
			--border-color: #dfdcd3;
			--brand-color: #e03e1a;
			--brand-hover: #c43212;
			--brand-text: #ffffff;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background: var(--bg-canvas);
			color: var(--text-primary);
			font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			-webkit-font-smoothing: antialiased;
		}
		main {
			width: 100%;
			max-width: 440px;
			border: 1px solid var(--border-color);
			border-radius: 16px;
			background: var(--bg-card);
			padding: 32px;
			text-align: center;
		}
		.brand {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			color: var(--text-primary);
			text-decoration: none;
			font-weight: 600;
			font-size: 16px;
			letter-spacing: -0.02em;
			margin-bottom: 24px;
		}
		.code {
			margin: 0;
			font-size: 13px;
			font-weight: 600;
			letter-spacing: 0.06em;
			text-transform: uppercase;
			color: var(--brand-color);
		}
		h1 {
			margin: 8px 0 12px;
			font-size: 26px;
			line-height: 1.15;
			letter-spacing: -0.03em;
		}
		p {
			margin: 0 0 24px;
			font-size: 15px;
			line-height: 1.6;
			color: var(--text-secondary);
		}
		.cta {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			padding: 10px 18px;
			border-radius: 12px;
			background: var(--brand-color);
			color: var(--brand-text);
			font-size: 14px;
			font-weight: 600;
			text-decoration: none;
		}
		.cta:hover { background: var(--brand-hover); }
	</style>
	<script>
		try {
			var s = localStorage.getItem("color-scheme");
			if (s === "light" || s === "dark") {
				document.documentElement.setAttribute("data-theme", s);
			}
		} catch (e) {}
	</script>
</head>
<body>
	<main>
		<a href="/" class="brand">
			<svg viewBox="0 0 64 64" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
				<rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="#111110" stroke="#2E2D2A" stroke-width="2.5" />
				<path d="M15 24V17C15 15.8954 15.8954 15 17 15H24M40 15H47C48.1046 15 49 15.8954 49 17V24M15 40V47C15 48.1046 15.8954 49 17 49H24M40 49H47C48.1046 49 49 48.1046 49 47V40" stroke="#F6F5F1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
				<rect x="20" y="22" width="19" height="4" rx="2" fill="#78756E" />
				<rect x="20" y="30" width="15" height="4" rx="2" fill="#78756E" />
				<path d="M18 46L46 18" stroke="#111110" stroke-width="9" stroke-linecap="round" />
				<path d="M18 46L46 18" stroke="#E03E1A" stroke-width="5" stroke-linecap="round" />
			</svg>
			<span>SynthIDClear</span>
		</a>
		<p class="code">404</p>
		<h1>Page not found</h1>
		<p>That page doesn't exist. Head back to the cleaner to inspect and strip hidden metadata locally in your browser.</p>
		<a href="/" class="cta">Go to SynthIDClear</a>
	</main>
</body>
</html>
